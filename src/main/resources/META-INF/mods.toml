mandatory=true
versionRange="[1.3.35,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="useless_core"
mandatory=true
versionRange="[1.0.14,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=true
versionRange="[15.0.0,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="useless_stretcher.mixins.json"
